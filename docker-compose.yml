name: project-news

x-wordpress-environment: &wordpress-environment
    WORDPRESS_DB_HOST: mysql
    WORDPRESS_DB_NAME: wordpress
    WORDPRESS_DB_USER: wordpress
    WORDPRESS_DB_PASSWORD: wordpress
    PROJECT_NEWS_WEBHOOK_SECRET: ${WORDPRESS_WEBHOOK_SECRET:-local-dev-webhook-secret}

x-database-url: &database-url postgresql://postgres:postgres@postgres:5432/project_news_db?schema=public

# API e worker usam a mesma imagem. O api/.env fornece GEMINI_API_KEY e os
# ajustes; os endereços abaixo trocam localhost pelos nomes dos serviços.
# Ambiente local: logs legíveis e Bull Board em /queues (NODE_ENV development).
x-api-service: &api-service
    profiles: ['app']
    build:
        context: ./api
        target: runtime
    init: true
    restart: unless-stopped
    env_file:
        - path: ./api/.env
          required: false
    environment: &api-environment
        NODE_ENV: development
        DATABASE_URL: *database-url
        REDIS_URL: redis://redis:6379
        WORDPRESS_URL: http://wordpress
        WORDPRESS_WEBHOOK_SECRET: ${WORDPRESS_WEBHOOK_SECRET:-local-dev-webhook-secret}

services:
    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: project_news_db
        ports:
            - '5433:5432'
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d project_news_db']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:8-alpine
        restart: unless-stopped
        command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
        ports:
            - '6380:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: wordpress
            MYSQL_USER: wordpress
            MYSQL_PASSWORD: wordpress
        ports:
            - '3307:3306'
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
            interval: 5s
            timeout: 5s
            retries: 20

    wordpress:
        image: wordpress:7.1-php8.4-apache
        restart: unless-stopped
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            <<: *wordpress-environment
        ports:
            - '8080:80'
        volumes:
            - wordpress_data:/var/www/html
            - ./wordpress/plugins/project-news-receiver:/var/www/html/wp-content/plugins/project-news-receiver

    wp-setup:
        image: wordpress:cli-php8.4
        user: '33:33'
        restart: on-failure
        depends_on:
            mysql:
                condition: service_healthy
            wordpress:
                condition: service_started
        environment:
            <<: *wordpress-environment
            HOME: /tmp
            WORDPRESS_URL: http://localhost:8080
            WORDPRESS_TITLE: Project News
            WORDPRESS_ADMIN_USER: admin
            WORDPRESS_ADMIN_PASSWORD: admin
            WORDPRESS_ADMIN_EMAIL: admin@example.com
        entrypoint: ['sh', '/opt/wp-setup.sh']
        volumes:
            - wordpress_data:/var/www/html
            - ./wordpress/plugins/project-news-receiver:/var/www/html/wp-content/plugins/project-news-receiver
            - ./wordpress/setup.sh:/opt/wp-setup.sh:ro

    migrate:
        profiles: ['app']
        build:
            context: ./api
            target: migrate
        environment:
            DATABASE_URL: *database-url
        depends_on:
            postgres:
                condition: service_healthy

    api:
        <<: *api-service
        environment:
            <<: *api-environment
            PORT: 3333
        ports:
            - '3333:3333'
        depends_on:
            migrate:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO /dev/null http://localhost:3333/api/health || exit 1']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    worker:
        <<: *api-service
        command: ['node', 'dist/worker.js']
        depends_on:
            migrate:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
            wp-setup:
                condition: service_completed_successfully

volumes:
    postgres_data:
    redis_data:
    mysql_data:
    wordpress_data:
